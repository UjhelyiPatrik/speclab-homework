# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Global configuration for all services, injected as environment variables
configMapGenerator:
  - name: global-app-config
    literals:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - PYTHONUNBUFFERED=1

# Confidential data for services, injected as environment variables (from secrets.env)
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env


resources:
  - imagegrab/deployment.yaml
  - resize/deployment.yaml
  - grayscale/deployment.yaml
  - object-detect/deployment.yaml
  - tag/deployment.yaml
  - minio/minio.yaml
  - redis/redis.yaml

  # Common labels for all resources
labels:
  - includeSelectors: true
    pairs:
      project: image-processor-v2